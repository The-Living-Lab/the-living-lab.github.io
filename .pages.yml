  - name: team
    label: Team
    type: collection
    path: team            
    filename: "{primary}.json" # Each member gets their own file (e.g., jane-doe.json)
    view:
      primary: name
      fields: [name, status, role, focus]
      sort: [status, name]
      default:
        sort: status
        order: desc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: published
        description: Published entries appear on the live site, hidden entries stay in Pages CMS and the GitHub repo
        options:
          values:
            - name: published
              label: Published
            - name: hidden
              label: Hidden
      - name: role
        label: General Role
        type: select
        required: true
        default: Current Lab Members
        options:
          values: ["Leadership Team", "Participating Faculty", "Current Lab Members", "Lab Alumni"]
        description: This directly corresponds to how team members are grouped on the live site
      - name: focus
        label: Short Description or Title
        type: string
      - name: bio
        label: Full Description or Bio
        type: rich-text
        description: DO NOT add headings or extra images here, it may mess up how live site looks
      - name: photo
        label: Photo
        type: image
        options:
          media: team
      - name: link
        label: Link
        type: string
        description: Optional site (e.g. LinkedIn, website) that links directly from the team member's name



  - name: events
    label: Events
    type: file
    path: events.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: published
        description: Published entries appear on the live site, hidden entries stay in Pages CMS and the GitHub repo
        options:
          values:
            - name: published
              label: Published
            - name: hidden
              label: Hidden
      - name: date
        label: Date
        type: date
        required: true
      - name: location
        label: Location
        type: string
      - name: summary
        label: Summary
        type: text



  - name: news
    label: News
    type: collection
    path: news
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, status, date, authors, guest_authors]
      sort: [status, date]
      default:
        sort: status
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: published
        description: Published entries appear on the website. Hidden entries stay in Pages CMS.
        options:
          values:
            - name: published
              label: Published
            - name: hidden
              label: Hidden
      - name: date
        label: Date
        type: date
        required: true
      - name: authors
        label: Living Lab Team Authors
        type: reference
        required: false
        options:
          collection: team
          multiple: true
          value: "{fields.name}"
          label: "{fields.name}"
          search: [fields.name]
      - name: guest_authors
        label: Guest Authors
        type: string
        list: true
        description: Manually type names of authors not in the Team collection.
      - name: image
        label: Top image
        type: image
        description: Shown at the top of the article.
        options:
          media: news
      - name: summary
        label: Summary
        type: text
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          media: news
          rename: safe