media:
  - name: general
    label: General Images
    input: media/general
    output: /media/general
    categories: [image]
  - name: projects
    label: Project Thumbnails
    input: media/projects
    output: /media/projects
    categories: [image]
  - name: project-html
    label: Project HTML Files
    input: projects/html
    output: /projects/html
    extensions: [html, htm]
    rename: safe
  - name: team
    label: Team Member Headshots
    input: media/team
    output: /media/team
    categories: [image]
  - name: events
    label: Events Media
    input: media/events
    output: /media/events
    categories: [image]
  - name: news
    label: News Images
    input: media/news
    output: /media/news
    categories: [image]

content:
  - name: projects
    label: Projects
    type: collection
    path: projects        # The GitHub folder where the project data is saved
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, authors, guest_authors, project_type, description]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: authors
        label: Living Lab Team Authors
        type: reference
        required: false
        options:
          collection: team
          multiple: true
          value: "{fields.name}"
          label: "{fields.name}"
          search: [fields.name]          
      - name: guest_authors
        label: Guest Authors
        type: string
        list: true
        description: Manually type names of authors not in the Team collection.
      - name: description
        label: Description
        type: text
      - name: thumbnail
        label: Thumbnail Image
        type: image
        options:
          media: projects
      - name: project_type
        label: Project type
        type: select
        description: Choose Deployed app for a site that is already online, or HTML file for a page uploaded here. The website opens whichever one you choose in a new tab.
        options:
          values:
            - name: app
              label: Deployed app
            - name: html
              label: HTML file
      - name: live_link
        label: Deployed app address
        type: string
        when:
          field: project_type
          equals: app
        description: Fill this in for a deployed app.
        pattern:
          regex: "^$|^https?://.+"
          message: Enter a full address starting with http:// or https://

      - name: html_file
        label: HTML file
        type: file
        when:
          field: project_type
          equals: html
        description: Upload an HTML file here for this project.
        options:
          media: project-html
          extensions: [html, htm]
          rename: safe

  - name: team
    label: Team
    type: collection
    path: team            
    filename: "{primary}.json" # Each member gets their own file (e.g., jane-doe.json)
    view:
      primary: name
      fields: [name, role, focused_role]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        required: true
        options:
          values: ["Leadership Team", "Participating Faculty", "Current Lab Member", "Lab Alumni"]
      - name: focused_role
        label: Focused Role
        type: string
      - name: photo
        label: Photo
        type: image
        options:
          media: team
      - name: link
        label: Link
        type: string
        hint: Optional site (e.g. LinkedIn, website) This does not create a profile page.

  - name: events
    label: Events
    type: file
    path: events.json
    format: json
    list: true
    view:
      primary: title
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: location
        label: Location
        type: string
      - name: summary
        label: Summary
        type: text
      - name: sample
        label: Sample placeholder
        type: boolean
        hint: Turn this on while the event is stand-in copy. The site shows a Sample label.

  - name: news
    label: News
    type: collection
    path: news
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, date, authors, guest_authors]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: authors
        label: Living Lab Team Authors
        type: reference
        required: false
        options:
          collection: team
          multiple: true
          value: "{fields.name}"
          label: "{fields.name}"
          search: [fields.name]
      - name: guest_authors
        label: Guest Authors
        type: string
        list: true
        description: Manually type names of authors not in the Team collection.
      - name: image
        label: Top image
        type: image
        description: Shown at the top of the article.
        options:
          media: news
      - name: summary
        label: Summary
        type: text
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          media: news
          rename: safe