<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News · Living Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-article="__ARTICLE_SLUG__">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">
        <img class="brand-logo" src="/media/general/Living%20Lab%20Logo.png" alt="Penn GSE Living Laboratory for Human Agency and Artificial Intelligence">
      </a>
      <nav class="site-nav" aria-label="Site">
        <a href="/">Home</a>
        <a href="/projects/">Projects</a>
        <details class="nav-menu">
          <summary>About Us</summary>
          <div class="nav-menu-panel">
            <span class="nav-later">Our Mission<span class="visually-hidden">, coming later</span></span>
            <a href="/team/">People</a>
            <span class="nav-later">Work With Us<span class="visually-hidden">, coming later</span></span>
          </div>
        </details>
        <details class="nav-menu is-current">
          <summary>Events &amp; Media</summary>
          <div class="nav-menu-panel">
            <a href="/events/">Events</a>
            <a href="/news/" aria-current="page">News</a>
            <span class="nav-later">Publications<span class="visually-hidden">, coming later</span></span>
            <span class="nav-later">Podcast<span class="visually-hidden">, coming later</span></span>
            <span class="nav-later">AI Tinkery<span class="visually-hidden">, coming later</span></span>
          </div>
        </details>
        <span class="nav-later">Newsletter<span class="visually-hidden">, coming later</span></span>
        <span class="nav-later">Academics<span class="visually-hidden">, coming later</span></span>
      </nav>
    </div>
  </header>

  <main class="page" id="article">
    <p class="empty">This article could not be found.</p>
  </main>

  <script src="/assets/vendor/marked.min.js"></script>
  <script>
    const slug = document.body.dataset.article;
    const main = document.querySelector("#article");

    function assetUrl(value) {
      if (!value) return "";
      const splitAt = value.search(/[?#]/);
      const filePath = splitAt === -1 ? value : value.slice(0, splitAt);
      const suffix = splitAt === -1 ? "" : value.slice(splitAt);
      return filePath.split("/").map((part, index) => (index === 0 ? part : encodeURIComponent(part))).join("/") + suffix;
    }

    function formatDate(key) {
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const [year, month, day] = key.split("-").map(Number);
      return `${months[month - 1]} ${day}, ${year}`;
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
    }

    function safeUrl(value) {
      const text = String(value || "").trim();
      if (/^https?:\/\//i.test(text)) return text;
      if (text.startsWith("/") && !text.startsWith("//") && !text.includes("..")) return text;
      return "";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    marked.use({
      gfm: true,
      walkTokens(token) {
        if (token.type === "heading") token.depth = Math.min(token.depth + 1, 6);
      },
      extensions: [{
        name: "underline",
        level: "inline",
        start(src) { return src.indexOf("++"); },
        tokenizer(src) {
          const match = /^\+\+([^\n]+?)\+\+/.exec(src);
          if (!match) return;
          return {
            type: "underline",
            raw: match[0],
            text: match[1],
            tokens: this.lexer.inlineTokens(match[1])
          };
        },
        renderer(token) {
          return `<ins>${this.parser.parseInline(token.tokens)}</ins>`;
        },
        childTokens: ["tokens"]
      }],
      renderer: {
        html(token) { return escapeHtml(token.text); }
      }
    });

    function renderMarkdown(source) {
      const template = document.createElement("template");
      template.innerHTML = marked.parse(String(source || ""));
      const root = template.content;
      root.querySelectorAll("script, iframe, object, embed, style, link, meta").forEach((node) => node.remove());
      root.querySelectorAll("*").forEach((node) => {
        for (const attr of [...node.attributes]) {
          const name = attr.name.toLowerCase();
          if (name.startsWith("on") || name === "style" || name === "srcdoc") node.removeAttribute(attr.name);
        }
      });
      root.querySelectorAll("a").forEach((link) => {
        const href = safeUrl(link.getAttribute("href"));
        if (!href) {
          link.replaceWith(document.createTextNode(link.textContent || ""));
          return;
        }
        link.setAttribute("href", href);
        if (/^https?:/i.test(href)) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      });
      root.querySelectorAll("img").forEach((image) => {
        const src = safeUrl(image.getAttribute("src"));
        if (!src) {
          image.remove();
          return;
        }
        image.setAttribute("src", assetUrl(src));
        image.removeAttribute("srcset");
      });
      root.querySelectorAll("table").forEach((table) => {
        const wrap = document.createElement("div");
        wrap.className = "article-table";
        table.replaceWith(wrap);
        wrap.append(table);
      });
      return root;
    }

    function authorChip(author) {
      const chip = document.createElement(author.link ? "a" : "div");
      chip.className = "author-chip";
      if (author.link) {
        chip.href = author.link;
        if (/^https?:\/\//i.test(author.link)) {
          chip.target = "_blank";
          chip.rel = "noopener noreferrer";
        }
      }
      if (author.photo) {
        const image = document.createElement("img");
        image.className = "portrait";
        image.src = assetUrl(author.photo);
        image.alt = "";
        chip.append(image);
      } else {
        const mark = document.createElement("div");
        mark.className = "initials";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = initials(author.name);
        chip.append(mark);
      }
      const name = document.createElement("span");
      name.textContent = author.name;
      chip.append(name);
      return chip;
    }

    function show(article) {
      document.title = `${article.title} · Living Lab`;
      main.replaceChildren();

      if (article.image) {
        const image = document.createElement("img");
        image.className = "article-hero";
        image.src = assetUrl(article.image);
        image.alt = "";
        main.append(image);
      }

      const title = document.createElement("h1");
      title.className = "page-title";
      title.textContent = article.title;
      main.append(title);

      if (article.date) {
        const date = document.createElement("p");
        date.className = "article-date";
        date.textContent = formatDate(article.date);
        main.append(date);
      }

      const authors = Array.isArray(article.authors) ? article.authors.filter((author) => author && author.name) : [];
      if (authors.length) {
        const row = document.createElement("ul");
        row.className = "author-row";
        for (const author of authors) {
          const item = document.createElement("li");
          item.append(authorChip(author));
          row.append(item);
        }
        main.append(row);
      }

      const guests = Array.isArray(article.guest_authors) ? article.guest_authors.filter(Boolean) : [];
      if (authors.length || guests.length) {
        let row = main.querySelector(".author-row");
        if (!row) {
          row = document.createElement("ul");
          row.className = "author-row";
          main.append(row);
        }
        for (const name of guests) {
          const item = document.createElement("li");
          item.append(authorChip({ name, photo: "", link: "" }));
          row.append(item);
        }
      }

      const body = document.createElement("div");
      body.className = "article-body";
      body.append(renderMarkdown(article.body || article.summary || ""));
      main.append(body);
    }

    fetch("/news.json", { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : []))
      .then((data) => {
        const articles = Array.isArray(data) ? data : [];
        const article = articles.find((item) => item && item.slug === slug);
        if (article) show(article);
      })
      .catch(() => {});
  </script>
</body>
</html>
